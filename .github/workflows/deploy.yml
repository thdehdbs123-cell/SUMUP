name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -- --base=/SUMUP/
      - name: Publish deployment branch
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DEPLOY_TOKEN" | base64 -w0)"
          touch dist/.nojekyll
          cd dist
          git init -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Deploy ${GITHUB_SHA}"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          DEPLOY_TOKEN: ${{ github.token }}
